<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Haven - Employee Accident/Incident Report Form</title>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 30px;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #000000;
      line-height: 1.4;
      width: 100%;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #ffffff;
    }

    .header {
      display: flex;
      align-items: flex-start;
      padding-bottom: 15px;
      border-bottom: 3px solid #000000;
      margin-bottom: 10px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-right: 20px;
      border: 1px solid #000000;
    }

    .header-text {
      flex: 1;
    }

    .header-text h1 {
      margin: 0 0 5px 0;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #000000;
    }

    .header-text h2 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: bold;
      color: #000000;
    }

    .header-text p {
      margin: 0;
      font-size: 11px;
      color: #000000;
      font-style: italic;
    }

    .intro {
      margin: 15px 0 25px 0;
      padding: 8px 0;
      font-size: 11px;
      line-height: 1.4;
      color: #000000;
      border-bottom: 1px solid #000000;
    }

    .section {
      margin-bottom: 20px;
    }

    .question {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #cccccc;
    }

    .question:last-child {
      border-bottom: none;
    }

    .question-label {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #000000;
      display: block;
    }

    .required {
      color: #000000;
      font-weight: bold;
    }

    .field-line {
      width: 100%;
      border: none;
      border-bottom: 1px solid #000000;
      background-color: transparent;
      font-size: 12px;
      padding: 5px 5px;
      color: #000000;
      box-sizing: border-box;
    }

    .field-line:focus {
      outline: none;
      border-bottom: 2px solid #000000;
    }

    .radio-group {
      margin-top: 8px;
    }

    .radio-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .radio-item input[type="radio"] {
      width: 16px;
      height: 16px;
      margin-right: 10px;
      border: 1px solid #000000;
    }

    .radio-item label {
      color: #000000;
    }

    .checkbox-group {
      margin-top: 8px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .checkbox-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-right: 10px;
      border: 1px solid #000000;
    }

    .checkbox-item label {
      color: #000000;
    }

    .textarea-field {
      width: 100%;
      min-height: 80px;
      border: 1px solid #000000;
      background-color: #ffffff;
      padding: 10px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #000000;
      resize: vertical;
      box-sizing: border-box;
      line-height: 1.6;
    }

    .textarea-field:focus {
      outline: none;
      border: 2px solid #000000;
    }

    .textarea-field.large {
      min-height: 120px;
    }

    .helper-text {
      font-size: 11px;
      color: #666666;
      margin-top: 4px;
      font-style: italic;
    }

    @media print {
      body {
        padding: 0;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>

 </head>
 <body>
  <div class="container">
   <header class="header"><img src="logo.png" alt="Street Haven Logo" class="logo" onerror="this.src=''; this.alt='[LOGO]'; this.style.display='flex'; this.style.alignItems='center'; this.style.justifyContent='center'; this.style.fontSize='12px';">
    <div class="header-text">
     <h1>JOINT HEALTH &amp; SAFETY COMMITTEE</h1>
     <h2>Employee Accident/Incident Report Form</h2>
     <p>When you submit this form, it will not automatically collect your details like name and email address unless you provide it yourself.</p>
    </div>
   </header>
   <main>
    <div class="intro"><strong>* Required</strong>
    </div>
    <section class="section">
     <div class="question"><label class="question-label">1. I am reporting a work related: <span class="required">*</span></label>
      <div class="checkbox-group">
       <div class="checkbox-item"><input type="checkbox" id="injury" aria-label="Injury"> <label for="injury">☐ Injury</label>
       </div>
       <div class="checkbox-item"><input type="checkbox" id="illness" aria-label="Illness"> <label for="illness">☐ Illness</label>
       </div>
       <div class="checkbox-item"><input type="checkbox" id="near-miss" aria-label="Near Miss"> <label for="near-miss">☐ Near Miss</label>
       </div>
      </div>
     </div>
     <div class="question"><label class="question-label" for="your-name">2. Your Name <span class="required">*</span></label> <input type="text" id="your-name" class="field-line" aria-label="Your name">
     </div>
     <div class="question"><label class="question-label" for="job-title">3. Job Title</label> <input type="text" id="job-title" class="field-line" aria-label="Job title">
     </div>
     <div class="question"><label class="question-label" for="supervisor">4. Supervisor <span class="required">*</span></label> <input type="text" id="supervisor" class="field-line" aria-label="Supervisor name">
     </div>
     <div class="question"><label class="question-label">5. Have you told your supervisor about this injury/near miss? <span class="required">*</span></label>
      <div class="radio-group">
       <div class="radio-item"><input type="radio" id="told-yes" name="told-supervisor" aria-label="Yes"> <label for="told-yes">○ Yes</label>
       </div>
       <div class="radio-item"><input type="radio" id="told-no" name="told-supervisor" aria-label="No"> <label for="told-no">○ No</label>
       </div>
      </div>
     </div>
     <div class="question"><label class="question-label" for="date-injury">6. Date of Injury/Near Miss <span class="required">*</span></label> <input type="text" id="date-injury" class="field-line" aria-label="Date of injury or near miss">
      <div class="helper-text">
       Please input date (M/d/yyyy)
      </div>
     </div>
     <div class="question"><label class="question-label" for="time-injury">7. Time of injury/near miss <span class="required">*</span></label> <input type="text" id="time-injury" class="field-line" aria-label="Time of injury or near miss">
     </div>
     <div class="question"><label class="question-label" for="witness">8. Name of Witness (if any)</label> <input type="text" id="witness" class="field-line" aria-label="Witness name">
     </div>
     <div class="question"><label class="question-label" for="location">9. Where, exactly did it happen? <span class="required">*</span></label> <textarea id="location" class="textarea-field" aria-label="Location of incident"></textarea>
     </div>
     <div class="question"><label class="question-label" for="doing">10. What were you doing at the time? <span class="required">*</span></label> <textarea id="doing" class="textarea-field" aria-label="Activity at time of incident"></textarea>
     </div>
     <div class="question"><label class="question-label" for="led-up">11. Describe step by step what led up to the injury/near miss <span class="required">*</span></label> <textarea id="led-up" class="textarea-field large" aria-label="Step by step description"></textarea>
     </div>
     <div class="question"><label class="question-label" for="prevent">12. What could have been done to prevent this injury/near miss? <span class="required">*</span></label> <textarea id="prevent" class="textarea-field large" aria-label="Prevention measures"></textarea>
     </div>
     <div class="question"><label class="question-label" for="body-parts">13. What parts of your body were injured? If a near miss, how could you have been hurt?</label> <textarea id="body-parts" class="textarea-field" aria-label="Body parts affected"></textarea>
     </div>
     <div class="question"><label class="question-label">14. Did you see a doctor about this injury/illness?</label>
      <div class="radio-group">
       <div class="radio-item"><input type="radio" id="doctor-yes" name="saw-doctor" aria-label="Yes"> <label for="doctor-yes">○ Yes</label>
       </div>
       <div class="radio-item"><input type="radio" id="doctor-no" name="saw-doctor" aria-label="No"> <label for="doctor-no">○ No</label>
       </div>
      </div>
     </div>
     <div class="question"><label class="question-label" for="doctor-name">15. If yes, whom did you see?</label> <input type="text" id="doctor-name" class="field-line" aria-label="Doctor name">
     </div>
     <div class="question"><label class="question-label" for="doctor-phone">16. Doctor's phone number</label> <input type="text" id="doctor-phone" class="field-line" aria-label="Doctor phone number">
     </div>
     <div class="question"><label class="question-label" for="visit-date">17. Date</label> <input type="text" id="visit-date" class="field-line" aria-label="Date of doctor visit">
      <div class="helper-text">
       Please input date (M/d/yyyy)
      </div>
     </div>
     <div class="question"><label class="question-label" for="visit-time">18. Time</label> <input type="text" id="visit-time" class="field-line" aria-label="Time of doctor visit">
     </div>
     <div class="question"><label class="question-label">19. Has this part of your body been injured before?</label>
      <div class="radio-group">
       <div class="radio-item"><input type="radio" id="injured-yes" name="injured-before" aria-label="Yes"> <label for="injured-yes">○ Yes</label>
       </div>
       <div class="radio-item"><input type="radio" id="injured-no" name="injured-before" aria-label="No"> <label for="injured-no">○ No</label>
       </div>
      </div>
     </div>
     <div class="question"><label class="question-label" for="when-injured">20. If yes, when?</label> <input type="text" id="when-injured" class="field-line" aria-label="When previously injured">
     </div>
    </section>
   </main>
  </div>
 </html>
